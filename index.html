<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>AURA — Next-Gen AI Assistant</title>
    <meta
      name="description"
      content="Next-generation AI assistant with reactive 3D hologram stage, smart modes, live web search, and Boss Admin control panel."
    />
    <meta property="og:title" content="AURA — Next-Gen AI Assistant" />
    <meta
      property="og:description"
      content="Next-generation AI assistant with reactive 3D hologram stage, smart modes, live web search, and Boss Admin control panel."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- PWA & Mobile Web App Meta & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060911" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AURA" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
      <style>
      html, body {
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      input, textarea, select {
        font-size: 16px !important;
      }
      </style>
    <script>
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
    </script>
    
  </head>
  <body class="bg-[#07090E] text-[#F1F5F9] antialiased selection:bg-[#00F0FF]/25 selection:text-white">
    <div id="root"></div>
        <!-- Android WebView Safe Guard & Service Worker -->
    <script>
      (function () {
        // 1. Safe localStorage polyfill if disabled in Android APK WebView
        try {
          var testKey = '__aura_test__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
        } catch (e) {
          var memStorage = {};
          var fallbackStorage = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(memStorage, k) ? memStorage[k] : null; },
            setItem: function (k, v) { memStorage[k] = String(v); },
            removeItem: function (k) { delete memStorage[k]; },
            clear: function () { memStorage = {}; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: fallbackStorage });
            Object.defineProperty(window, 'sessionStorage', { value: fallbackStorage });
          } catch (_) {}
        }

        // 2. Safe crypto.randomUUID polyfill for older Android WebView
        if (typeof window.crypto !== 'undefined' && typeof window.crypto.randomUUID !== 'function') {
          window.crypto.randomUUID = function () {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              var r = (Math.random() * 16) | 0;
              var v = c === 'x' ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            });
          };
        }

        // 3. Show clear diagnostic message instead of blank black screen on crash
        window.addEventListener('error', function (ev) {
          var root = document.getElementById('root');
          if (root && !root.innerHTML.trim()) {
            root.innerHTML = '<div style="padding:24px;color:#f87171;font-family:sans-serif;font-size:14px;">App Error: ' + (ev.message || 'Unknown error') + '</div>';
          }
        });

        // 4. Service Worker (skip inside restricted WebView protocols)
        if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          });
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
